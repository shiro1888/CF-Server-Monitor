# prod-watch-core production config
# acceptance test 2026-11-15T04:36 for Workers Builds / manual deploy (2026-11-15)
# keep_vars = true preserves existing secrets (API_SECRET) and plain vars (CORS_ALLOWED_ORIGINS)
name = "prod-watch-core"
main = "src/index.js"
compatibility_date = "2026-06-26"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false

[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "prod-watch-db"
database_id = "71afa248-e906-486e-afff-3ae3b88c070a"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]
