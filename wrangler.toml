# Cloudflare Workers 配置
name = "prod-watch-core"
main = "src/index.js"
compatibility_date = "2026-06-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "probe.shiro1888.com"
custom_domain = true

keep_vars = true

# 定时任务配置（UTC）
# - 每2分钟：执行离线节点检测
#   （2026-07-27 由 */1 改为 */2 以降低请求量：1440/天 -> 720/天。
#    离线判定阈值是硬编码的 300000ms/5分钟，与本 cron 间隔无关，
#    所以最坏告警延迟只从 ~6 分钟变为 ~7 分钟。
#    阈值位置（已按上游 146 个提交合并后校正）：
#      src/frontend/utils/constants.js:4  ONLINE_THRESHOLD_MS
#      src/handlers/dashboard.js:134
#      src/handlers/admin.js:411
#    原注释引用的 src/services/notification.js 在上游重构后已不含该阈值。）
# - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/2 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "prod-watch-db"
database_id = "71afa248-e906-486e-afff-3ae3b88c070a"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
