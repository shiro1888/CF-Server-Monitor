name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This fork owns its live Worker configuration and deployment workflow.
      # Do not let an automatic upstream sync overwrite those production files.
      - name: Protect fork-owned production files
        env:
          UPSTREAM_REPOSITORY: huilang-me/CF-Server-Monitor
          UPSTREAM_BRANCH: main
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi
          git fetch --no-tags upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          protected_files="$(
            git log --format= --name-only "HEAD..upstream/${UPSTREAM_BRANCH}" -- \
              wrangler.toml .github/workflows/deploy.yml .github/workflows/sync.yml |
              sed '/^$/d' | sort -u
          )"
          if [ -n "$protected_files" ]; then
            echo "::error::Upstream changed fork-owned production files. Manual merge is required before deployment."
            printf '%s\n' "$protected_files"
            exit 1
          fi

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: huilang-me/CF-Server-Monitor
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 上游改动了本项目的生产配置，或更新无法自动合并；未推送任何变更，请人工审核后再同步。"
          echo "[Error] Upstream changed fork-owned production files, or the update could not be merged automatically. No changes were pushed; manual review is required."
          exit 1

      # Commits made with GITHUB_TOKEN do not trigger push-based workflows.
      # Explicitly dispatch the deployment after a successful upstream sync.
      - name: Deploy synced Worker
        if: success() && steps.sync.outputs.has_new_commits == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
