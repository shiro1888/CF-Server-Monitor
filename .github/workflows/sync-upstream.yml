name: Sync upstream CF-Server-Monitor

permissions:
  contents: write

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC, same slot as the legacy auto-update job
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take upstream tree, keep fork-only workflows
        run: |
          git config user.name "cfsm-sync-bot"
          git config user.email "4444023+cfsm-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch upstream main
          git checkout upstream/main -- .
          git checkout HEAD -- .github/workflows/deploy.yml .github/workflows/sync-upstream.yml
          rm -f .github/workflows/sync.yml .github/workflows/deploy-github-page.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to sync"
          else
            git commit -m "sync: upstream CF-Server-Monitor $(date -u +%Y-%m-%d)"
          fi
          git push origin main
