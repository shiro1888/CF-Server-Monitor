name: Manual deploy prod-watch-core (fallback)

# push 自动部署已由 Cloudflare Workers Builds 接管(Git 集成,卡片显示 GitHub 徽标)。
# 本 workflow 仅作为手动补部署通道。上游同步由 sync-upstream.yml 完成。

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build:frontend
      - name: Deploy Worker
        run: npx wrangler@4 deploy -c wrangler-build.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
